<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efefef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Markers">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Markers — ゴルフの記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efefef;
    --card: #ffffff;
    --ink: #3d4441;
    --ink-soft: #a2a8a5;
    --line: #e7e7e7;
    --grass: #bcd3c9;
    --fairway: #79a694;
    --green: #c4c7c5;
    --sky: #9cc3d9;
    --sand: #f6d9cd;
    --sand-deep: #f4b097;
    --flag: #ea9f86;
    --gold: #f2c46d;
    --mincho: "DM Sans", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --maru: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --hand: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --tab-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { position: relative; }
  body { background: var(--paper); color: var(--ink); font-family: var(--maru); font-size: 15px; min-height: 100vh; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px); }
  /* 夏の空と入道雲（上）から、砂浜のクリーム（下）へ */
  body::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 560px; z-index: -1; pointer-events: none;
    background:
      radial-gradient(30% 11% at 78% 7%, #ffffff 55%, transparent 72%),
      radial-gradient(20% 8% at 60% 12%, #ffffff 50%, transparent 72%),
      radial-gradient(26% 9% at 10% 10%, rgba(236,230,211,.85) 45%, transparent 72%),
      radial-gradient(34% 12% at 84% 9%, rgba(182,182,172,.55) 50%, transparent 74%),
      linear-gradient(180deg, #efefef 0, #efefef 220px, #efefef 520px); }
  /* 紙のざらつき */
  body::after { content: ""; position: fixed; inset: 0; z-index: 70; pointer-events: none; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); background-size: 160px; opacity: .16; mix-blend-mode: multiply; }
  button { font-family: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 18px; }
  .eyebrow { font-size: 11px; letter-spacing: .32em; color: var(--fairway); font-weight: 700; }
  h1, h2, h3 { font-family: var(--mincho); font-weight: 700; margin: 0; }
  .page-head { padding: calc(env(safe-area-inset-top) + 22px) 0 10px; display: flex; align-items: flex-end; justify-content: space-between; }
  .page-head h2 { font-size: 26px; margin-top: 4px; }
  .muted { color: var(--ink-soft); font-size: 12px; }
  .view { display: none; }
  .view.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; opacity: .7; }

  /* タブバー */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; z-index: 20; }
  .tabbar button { flex: 1; background: none; border: none; font-size: 10px; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; letter-spacing: .05em; }
  .tabbar button .ic { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .6; }
  .tabbar button.on { color: var(--fairway); font-weight: 700; }
  .tabbar button.on .ic { filter: none; opacity: 1; }
  .fab { position: fixed; right: max(18px, calc(50% - 360px)); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--flag); color: #fff; font-size: 30px; box-shadow: 3px 3px 0 rgba(0,0,0,.16); cursor: pointer; z-index: 21; }

  /* まとめの数字 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 8px; text-align: center; }
  .stat b { display: block; font-family: var(--mincho); font-size: 26px; line-height: 1.1; }
  .stat span { font-size: 10px; letter-spacing: .15em; color: var(--ink-soft); font-weight: 700; }
  .stat.best b { color: var(--gold); }

  /* 推移（フェアウェイ） */
  .trend { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 0 4px; position: relative; overflow: hidden; }
  .trend-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .trend-scroll::-webkit-scrollbar { display: none; }
  .trend svg { display: block; }
  .trend .coin-pt { cursor: pointer; }
  .trend-legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-soft); padding: 2px 14px 6px; }
  .trend-legend i { display: inline-block; width: 16px; height: 0; border-top: 1.5px dashed #a2a8a5; margin-right: 4px; vertical-align: 3px; }
  .trend-tabs { display: flex; align-items: center; padding: 2px 12px 4px; }

  /* マーカー（コイン） */
  .sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
  .sec-title h3 { font-size: 18px; }
  .coins { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 10px; }
  .coin-wrap { text-align: center; cursor: pointer; }
  /* 本物のボールマーカーのように：ふちにコース名と日付、真ん中に空と海の小さな景色とスコア */
  .coin { width: 100px; height: 100px; margin: 0 auto; display: block; position: relative; }
  .coin svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .coin-wrap .c { font-size: 11px; margin-top: 7px; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .month { grid-column: 1 / -1; font-family: var(--mincho); font-size: 14px; color: var(--fairway); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 4px; display: flex; justify-content: space-between; }
  .month small { font-family: var(--maru); color: var(--ink-soft); font-size: 11px; }

  /* 傾向 */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card h4 { margin: 0 0 2px; font-size: 13px; letter-spacing: .1em; }
  .card .now { font-family: var(--mincho); font-size: 22px; font-weight: 700; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; }
  .mini-wrap { display: flex; margin-top: 6px; }
  .mini-axis { flex: none; display: block; }
  .mini-scroll { flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .mini-scroll::-webkit-scrollbar { display: none; }
  .mini-scroll svg { display: block; }
  .bars { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; }
  .bar .track { height: 12px; background: #f1f1f1; border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 6px; }
  .courses { width: 100%; border-collapse: collapse; font-size: 13px; }
  .courses td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .courses td.n { text-align: right; white-space: nowrap; font-family: var(--mincho); font-weight: 700; }

  /* シート */
  .sheet-bg { position: fixed; inset: 0; background: rgba(47,61,53,.4); z-index: 40; display: none; }
  .sheet-bg.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; z-index: 41; transform: translateY(100%); transition: transform .28s ease; padding: 10px 0 calc(env(safe-area-inset-bottom) + 24px); }
  .sheet.on { transform: none; }
  .sheet.dragging { transition: none; }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #dddddd; margin: 0 auto 12px; cursor: grab; }
  .sheet .wrap { max-width: 640px; }

  /* ラウンド詳細 */
  .detail-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .detail-head .coin { width: 108px; height: 108px; flex: none; margin: 0; }
  .detail-head h3 { font-size: 19px; line-height: 1.35; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: #f2f2f2; color: var(--ink); }
  .halves { display: flex; gap: 12px; font-size: 13px; margin-top: 6px; }
  .halves b { font-family: var(--mincho); font-size: 18px; }
  .sc { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .sc th { background: var(--fairway); color: #fff; font-weight: 500; font-size: 10px; padding: 6px 2px; letter-spacing: .05em; }
  .sc td { text-align: center; padding: 6px 2px; border-bottom: 1px solid var(--line); }
  .sc tr.sum td { background: #eef5f1; font-weight: 700; }
  .sc td.h { font-weight: 700; color: var(--fairway); }
  .mk { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; font-family: var(--mincho); font-weight: 700; font-size: 16px; }
  .mk.bd { border: 2px solid var(--flag); border-radius: 50%; color: var(--flag); }
  .mk.eg { border: 2px double var(--flag); border-radius: 50%; color: var(--flag); }
  .mk.par { color: var(--fairway); }
  .mk.bg { background: #e3eff5; border-radius: 4px; }
  .mk.db { background: var(--sand); border-radius: 4px; }
  .mk.tp { background: var(--sand-deep); color: #fff; border-radius: 4px; }
  .dir { font-size: 13px; }
  .dir.ok { color: var(--green); }
  .dir.l, .dir.r { color: #4f8fb0; }
  .sub { font-size: 10px; color: var(--ink-soft); }
  .note { font-family: var(--hand); line-height: 1.9; white-space: pre-wrap; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 6px 0 12px; }
  .note-label { font-size: 11px; letter-spacing: .25em; font-weight: 700; color: var(--fairway); margin-top: 14px; }
  .note-label.issue { color: var(--flag); }
  .note-edit { display: block; width: 100%; resize: none; overflow: hidden; min-height: 70px; color: var(--ink); outline: none; }
  .note-edit:focus { border-color: var(--fairway); }
  .note-edit::placeholder { color: #c4c4c4; }
  #note-status { text-align: right; min-height: 16px; margin-top: -4px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 7px 2px; }
  .kpi b { display: block; font-family: var(--mincho); font-size: 18px; }
  .kpi span { font-size: 10px; color: var(--ink-soft); }
  .dist { display: flex; height: 22px; border-radius: 11px; overflow: hidden; margin: 6px 0 4px; }
  .dist div { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; }
  .dist-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-soft); }
  .dist-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; }

  /* 入力フォーム */
  .form label { display: block; font-size: 10px; letter-spacing: .25em; color: var(--ink-soft); font-weight: 700; margin: 14px 0 5px; }
  .form input, .form select, .form textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .form textarea { font-family: var(--hand); min-height: 100px; line-height: 1.8; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--fairway); border-color: var(--fairway); color: #fff; }
  .hole { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .hole .top { display: grid; grid-template-columns: 30px auto 1fr 1fr; gap: 8px; align-items: center; }
  .hole .no { font-family: var(--mincho); font-weight: 700; font-size: 18px; color: var(--fairway); }
  .hole input { padding: 7px 8px; font-size: 16px; text-align: center; }
  .hole .mini-l { font-size: 9px; color: var(--ink-soft); letter-spacing: .1em; display: block; text-align: center; margin-bottom: 2px; }
  .hole .more { display: grid; grid-template-columns: 1.2fr 1.6fr; gap: 8px; margin-top: 8px; align-items: end; }
  .hole .more3 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .hole select { padding: 7px 6px; font-size: 15px; }
  .seg.sm button { padding: 4px 9px; font-size: 12px; }
  .half-sum { text-align: right; font-size: 13px; margin: 4px 2px 12px; color: var(--ink-soft); }
  .half-sum b { font-family: var(--mincho); font-size: 18px; color: var(--ink); }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 15px; cursor: pointer; }
  .btn.primary { background: var(--fairway); border-color: var(--fairway); color: #fff; font-weight: 700; }
  .btn.danger { color: var(--flag); flex: 0 0 auto; }
  details summary { cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 90px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; z-index: 60; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: .92; }
  /* ピン位置（グリーンを上から見た図。上が奥） */
  .pin { display: inline-grid; grid-template-columns: repeat(3, 22px); grid-auto-rows: 22px; gap: 2px; padding: 6px 8px; border-radius: 50%; background: radial-gradient(circle, #e4efe8 58%, #c9dccf); }
  .pin button { border: 0; padding: 0; background: transparent; border-radius: 50%; cursor: pointer; font-size: 10px; color: transparent; font-family: inherit; }
  .pin button.on { background: var(--flag); }
  .pin.lg { grid-template-columns: repeat(3, 64px); grid-auto-rows: 46px; padding: 16px 26px; }
  .pin.lg button { font-size: 11px; color: #6b8a5a; }
  .pin.lg button.on { color: #fff; }
  .pin-wrap { text-align: center; }
  .pin-wrap .muted { margin-top: 4px; }
  .sc tr.memo td { text-align: left; font-family: var(--hand); font-size: 12px; color: var(--ink); padding: 0 8px 7px; border-bottom: 1px solid var(--line); }
  .sc tr.has-memo td { border-bottom: none; }
  /* ラウンド中モード */
  .live-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .live-holes { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .live-holes::-webkit-scrollbar { display: none; }
  .live-holes button { flex: none; width: 31px; height: 31px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 12px; cursor: pointer; padding: 0; }
  .live-holes button.done { background: #e6f0eb; }
  .live-holes button.on { background: var(--fairway); color: #fff; border-color: var(--fairway); }
  .live-head { display: flex; justify-content: space-between; align-items: flex-end; margin: 12px 0; gap: 10px; }
  .live-head h2 { font-size: 32px; }
  .live-head .r { text-align: right; }
  .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .live-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  .step button { width: 50px; height: 50px; border-radius: 50%; border: none; background: #e6f0eb; font-size: 26px; color: var(--fairway); cursor: pointer; }
  .step b { font-family: var(--mincho); font-size: 34px; }
  .step.sm { padding: 4px; border-radius: 10px; }
  .step.sm button { width: 30px; height: 30px; font-size: 18px; }
  .step.sm b { font-size: 20px; }
  .two-l { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .layout-link { display: block; text-align: center; text-decoration: none; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 14px; margin-bottom: 4px; }
  .live-banner { display: block; width: 100%; margin: 4px 0 12px; padding: 12px; border-radius: 12px; border: none; background: var(--fairway); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .35; }
  /* 押したことが分かるように */
  button, .coin-wrap, .coin-pt, .layout-link, .live-banner { transition: transform .12s ease, filter .12s ease, background-color .15s ease, color .15s ease, box-shadow .12s ease; }
  button:active:not(:disabled), .layout-link:active, .live-banner:active { transform: scale(.95); filter: brightness(.9); }
  .fab:active { transform: scale(.9); box-shadow: 1px 1px 0 rgba(0,0,0,.16); }
  .tabbar button:active .ic { transform: scale(.85); }
  .coin-wrap:active { transform: scale(.94); }
  .coin-pt:active { opacity: .6; }
  .seg button.on { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); font-weight: 700; }
  .seg button.on::before { content: "✓ "; font-size: .85em; }
  .seg.sm button.on::before { content: ""; }
  .pin button:active { background: rgba(207,111,69,.35); }
  .btn.busy { opacity: .7; pointer-events: none; }
  .btn.busy::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: var(--flag); } 100% { transform: scale(1); } }
  .step b.pop { display: inline-block; animation: pop .28s ease; }
  @keyframes slideL { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .slide-l { animation: slideL .22s ease; }
  .slide-r { animation: slideR .22s ease; }
  .toast.ok::before { content: "✓ "; }
  /* 練習 */
  .practices { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .pr { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; transition: transform .12s ease, filter .12s ease; box-shadow: 3px 3px 0 rgba(0,0,0,.08); }
  .pr:active { transform: scale(.97); filter: brightness(.95); }
  .pr .tee { flex: none; width: 42px; height: 42px; border-radius: 50%; background: #eef5f1; border: 1px solid #3d4441; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 17px; line-height: 1; }
  .pr .tee small { font-size: 9px; margin-top: 2px; color: var(--ink-soft); }
  .pr .b { flex: 1; min-width: 0; }
  .pr .t { font-size: 12px; color: var(--ink-soft); }
  .pr .g { font-family: var(--hand); font-size: 14px; line-height: 1.6; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pr .g.none { color: #c4c4c4; }
  .thumb { flex: none; position: relative; width: 64px; height: 64px; border-radius: 9px; overflow: hidden; background: #eeeeee; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { position: absolute; right: 3px; bottom: 3px; background: rgba(0,0,0,.75); color: #fff; font-size: 10px; border-radius: 8px; padding: 0 5px; line-height: 16px; }
  .good-item { display: flex; gap: 12px; align-items: flex-start; }
  .good-item .gb { flex: 1; min-width: 0; }
  .choose { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 6px; }
  .choose button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 20px 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .choose button span { font-size: 30px; }
  .goods { display: flex; flex-direction: column; gap: 10px; }
  .good-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; transition: transform .12s ease; }

<script>
/* ================= 設定と保存（GitHubの非公開リポジトリ） ================= */
const APP_VERSION = '2026-11-10i';
const CFG_KEY = 'markers-config';
const CACHE_KEY = 'markers-cache';
const LIVE_KEY = 'markers-live';  // ラウンド中の入力（電波がなくても消えないよう端末に置く）
const PINS = ['奥・左', '奥・中', '奥・右', '中・左', 'センター', '中・右', '手前・左', '手前・中', '手前・右'];
const WEATHER = ['晴れ', '曇り', '雨', '風強い'];
const TEES = ['レギュラー', 'レディース', 'バック', 'フロント'];
const CLUBS = ['1W', '3W', '4W', '5W', '7W', 'U4', 'U5', 'U6', '5i', '6i', '7i', '8i', '9i', 'PW', 'AW', 'SW'];

let cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
cfg.repo = cfg.repo || 'tkwkt123-ops/markers-data';
// StubsとMarkersは同じ場所（tkwkt123-ops.github.io）なので、GitHubのキーを共有する。どちらかで1回入れれば両方で使える
const SHARED_TOKEN_KEY = 'tkwkt-github-token';
function sharedToken() {
  return localStorage.getItem(SHARED_TOKEN_KEY)
    || JSON.parse(localStorage.getItem('souko-config') || '{}').token
    || JSON.parse(localStorage.getItem('markers-config') || '{}').token || '';
}
if (!cfg.token) cfg.token = sharedToken();
let db = { version: 1, rounds: [] };
let sha = null;

const b64enc = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

async function gh(path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`, {
    ...opt, cache: 'no-store',
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', ...(opt.headers || {}) },
  });
  if (!r.ok) { const e = new Error(r.status); e.status = r.status; throw e; }
  return r.json();
}
async function pull() {
  const j = await gh('data.json');
  sha = j.sha;
  db = normalize(JSON.parse(b64dec(j.content)));
  localStorage.setItem(CACHE_KEY, JSON.stringify(db));
}
function normalize(d) {
  d.rounds ||= []; d.courses ||= []; d.practices ||= [];
  d.practices.forEach(p => { p.links ||= []; });
  d.rounds.forEach(r => { r.holes ||= []; r.links ||= []; });
  return d;
}
// 毎回最新を取り直してから変更を当てる（PCとスマホ、Claudeの書き込みがぶつからないように）
async function commit(mutate, msg) {
  for (let i = 0; i < 3; i++) {
    try {
      await pull();
      mutate(db);
      const j = await gh('data.json', { method: 'PUT', body: JSON.stringify({ message: msg, content: b64enc(JSON.stringify(db, null, 1) + '\n'), sha }) });
      sha = j.content.sha;
      localStorage.setItem(CACHE_KEY, JSON.stringify(db));
      renderAll();
      return true;
    } catch (e) {
      if (e.status === 409 && i < 2) continue;
      toast('保存できませんでした（' + (e.status || '通信エラー') + '）');
      return false;
    }
  }
}

/* ================= 小道具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.toggle('ok', /保存しました|消しました|入れました|開きました/.test(m)); t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
// ボタンを「処理中」にする（二度押し防止）。終わったら元に戻す関数を返す
function busy(btn, label) {
  if (!btn) return () => {};
  const old = btn.innerHTML; btn.classList.add('busy'); btn.disabled = true; if (label) btn.textContent = label;
  return () => { btn.classList.remove('busy'); btn.disabled = false; btn.innerHTML = old; };
}
const md = d => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };
const shortCourse = c => c.replace(/【.*?】|（.*?）|\(.*?\)/g, '').replace(/カントリー(クラブ|倶楽部)/, 'CC').replace(/ゴルフ(クラブ|倶楽部|コース)/, 'GC').trim();
function tab(v) {
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#scroller').scrollTop = 0;
  if (v === 'trend' && db.rounds.length) renderTendency();
  if (v === 'home') renderPracticeChart();
  // 隠れていた間に描いたグラフは、開いたときに右端（最新）へ
  document.querySelectorAll(`#v-${v} .mini-scroll, #v-${v} .trend-scroll`).forEach(e => { e.scrollLeft = e.scrollWidth; });
}

/* ================= 計算 ================= */
const sorted = () => [...db.rounds].sort((a, b) => a.date.localeCompare(b.date));
function scoreOf(h, from, to) { const xs = h.slice(from, to).map(x => x.score); return xs.every(v => v != null) && xs.length ? sum(xs) : null; }
const total = r => r.holes.length === 18 ? scoreOf(r.holes, 0, 18) : r.total ?? null;
const outS = r => scoreOf(r.holes, 0, 9);
const inS = r => scoreOf(r.holes, 9, 18);
function putts(r) { const p = r.holes.map(h => h.putts); return p.length === 18 && p.every(v => v != null) ? sum(p) : r.putts ?? null; }
const hasPar = r => r.holes.length === 18 && r.holes.every(h => h.par);
function stats(r) {
  const H = r.holes, s = {};
  if (hasPar(r)) {
    s.par = sum(H.map(h => h.par));
    const withP = H.filter(h => h.putts != null);
    if (withP.length === 18) {
      s.gir = H.filter(h => h.score - h.putts <= h.par - 2).length;
      s.bon = H.filter(h => h.score - h.putts <= h.par - 1).length;
      s.three = H.filter(h => h.putts >= 3).length;
    }
    const fwH = H.filter(h => h.par >= 4 && h.dir);
    if (fwH.length) s.fw = [fwH.filter(h => h.dir === '◯').length, fwH.length];
    const p3 = H.filter(h => h.par === 3 && h.dir);
    if (p3.length) s.on1 = [p3.filter(h => h.dir === '◯').length, p3.length];
    s.dist = { bd: 0, par: 0, bg: 0, db: 0, tp: 0 };
    H.forEach(h => { const d = h.score - h.par; s.dist[d < 0 ? 'bd' : d === 0 ? 'par' : d === 1 ? 'bg' : d === 2 ? 'db' : 'tp']++; });
  }
  s.ob = sum(H.map(h => h.ob || 0)); s.bunker = sum(H.map(h => h.bunker || 0)); s.pen = sum(H.map(h => h.pen || 0));
  s.detail = H.some(h => h.dir || h.club || h.ob != null);
  return s;
}
// 参考画像（夏の港町のイラスト）からとった、少しくすんだ色
// セージとサーモンの濃淡（参考：Pinterestのアプリデザイン）
function coinColor(t) {
  if (t == null) return '#d0d0d0';
  if (t < 90) return '#ea9f86';       // 濃いサーモン
  if (t < 95) return '#f4b097';       // サーモン
  if (t < 100) return '#79a694';      // セージ
  if (t < 105) return '#9dbcaf';      // 薄いセージ
  if (t < 110) return '#b9c6c0';      // グレーがかったセージ
  return '#cfd2d0';                   // グレー
}
function bestRound() { let b = null; db.rounds.forEach(r => { const t = total(r); if (t != null && (!b || t < total(b))) b = r; }); return b; }

/* ================= ホーム ================= */
function renderHome() {
  const rs = sorted().filter(r => total(r) != null);
  const best = bestRound();
  const last5 = rs.slice(-5).map(total);
  const avg5 = last5.length ? (sum(last5) / last5.length).toFixed(1) : '–';
  const p5 = rs.map(putts).filter(v => v != null).slice(-5);
  const avgP = p5.length ? (sum(p5) / p5.length).toFixed(1) : '–';
  $('#stats').innerHTML = `
    <div class="stat best"><b>${best ? total(best) : '–'}</b><span>ベスト</span></div>
    <div class="stat"><b>${avg5}</b><span>直近5回の平均</span></div>
    <div class="stat"><b>${avgP}</b><span>直近5回のパット</span></div>`;
  const live = liveState();
  $('#live-banner').innerHTML = live ? `<button class="live-banner" onclick="resumeLive()">ラウンド中：${esc(shortCourse(live.draft.course))}　${live.idx + 1}番ホールから続ける</button>` : '';
  renderPracticeChart();
  renderCoins(best);
  $('#count').textContent = `${db.rounds.length}ラウンド`;
}

// グラフに出す範囲：直近10回／今年／全部（端末に覚えておく）
let trendRange = localStorage.getItem('markers-range') || 'all', trendSyncing = false;
function setRange(v) { trendRange = v; localStorage.setItem('markers-range', v); renderHome(); }
const SCORE_CHART = { el: '#trend', val: total, guides: [[100, '100'], [90, '90']], color: t => coinColor(t), markers: true, pad: [88, 102], legend: '100・90', tabs: true };
const PUTTS_CHART = { el: '#trend-putts', val: r => putts(r), guides: [[36, '36']], color: () => '#8fb5a5', markers: false, pad: [34, 38], legend: '36', tabs: false };
function renderTrend(all, best, o = SCORE_CHART) {
  const el = $(o.el);
  if (!all.length) { el.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  const year = String(new Date().getFullYear());
  const ranged = trendRange === '10' ? all.slice(-10) : trendRange === 'year' ? all.filter(r => r.date.startsWith(year)) : all;
  const rs = ranged.filter(r => o.val(r) != null);
  if (!rs.length) { el.innerHTML = '<div class="empty">この期間の記録がありません</div>'; return; }
  const n = rs.length;
  // 記録がない回も場所はあけておく（スコアとパットのグラフで、同じ回が同じ位置に来るように）
  const pos = rs.map(r => ranged.indexOf(r)), N = ranged.length;
  const padL = 26, padR = 26, H = 260, top = 30, bot = 46;
  const cw = el.clientWidth || 340;
  // 全部が画面に収まるように間隔を決める（狭すぎるときだけ横にスクロール）
  const step = N > 1 ? Math.max(34, (cw - padL - padR) / (N - 1)) : 0;
  const W = Math.max(cw, padL + padR + step * (N - 1));
  const big = o.markers && step >= 40;   // 間隔が広いときはマーカー、狭いときは小さな点＋数字
  const ts = rs.map(o.val);
  const avg = sum(ts) / n;
  const lo = Math.min(...ts, o.pad[0]) - 3, hi = Math.max(...ts, o.pad[1]) + 3;
  // 少ない打数ほど下に
  const y = t => top + (hi - t) / (hi - lo) * (H - top - bot);
  const x = i => N === 1 ? W / 2 : padL + pos[i] * step;
  const pts = rs.map((r, i) => [x(i), y(ts[i])]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${x(n - 1)} ${H - bot} L${x(0)} ${H - bot} Z`;
  const guide = (t, label) => t > lo && t < hi ? `<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#a2a8a5" stroke-opacity=".5" stroke-dasharray="4 5" stroke-width="1"/><text x="${W - 4}" y="${y(t) - 4}" font-size="9.5" fill="#a2a8a5" text-anchor="end">${label}</text>` : '';
  const avgLine = `<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f4b097" stroke-width="2.2" opacity=".85"/>`;
  let months = '', prevM = '', lastMX = -99;
  const every = Math.ceil(28 / step);  // 日付は重ならない間隔で
  rs.forEach((r, i) => {
    const m = r.date.slice(0, 7);

function scorecard(r, from, to, label) {

  const s = scoreOf(r.holes, from, to), p = H.every(h => h.putts != null) ? sum(H.map(h => h.putts)) : '';
  const ps = par ? sum(H.map(h => h.par)) : null;

}

// 書いている途中の文は端末に残し、手を止めたらGitHubへ。電波がなくても消えない
const NOTE_PREFIX = 'markers-note-';
let noteTimer = null, noteSaving = false;
function pendingNote(id) { try { return JSON.parse(localStorage.getItem(NOTE_PREFIX + id) || 'null'); } catch (e) { return null; } }
function noteHTML(r) {
  const p = pendingNote(r.id);
  const good = p ? p.good : r.good || '', issue = p ? p.issue : r.issue || '';
  return `<div class="note-label" style="margin-top:4px">良かったこと</div>
    <textarea class="note note-edit" id="n-good" rows="2" placeholder="タップして書く" oninput="noteInput('${r.id}', this)" onblur="noteFlush('${r.id}')">${esc(good)}</textarea>
    <div class="note-label issue">課題・反省</div>
    <textarea class="note note-edit" id="n-issue" rows="2" placeholder="タップして書く" oninput="noteInput('${r.id}', this)" onblur="noteFlush('${r.id}')">${esc(issue)}</textarea>
    <div class="muted" id="note-status">${p ? 'まだ保存できていない文があります' : ''}</div>`;
}
function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
function noteInput(id, el) {
  autosize(el);
  localStorage.setItem(NOTE_PREFIX + id, JSON.stringify({ good: $('#n-good').value, issue: $('#n-issue').value }));
  $('#note-status').textContent = '書いています…';
  clearTimeout(noteTimer); noteTimer = setTimeout(() => noteFlush(id), 1500);
}
async function noteFlush(id) {
  clearTimeout(noteTimer);
  const p = pendingNote(id); if (!p || noteSaving) return;
  const r = db.rounds.find(x => x.id === id);
  const st = () => document.getElementById('note-status');
  if (r && (r.good || '') === p.good && (r.issue || '') === p.issue) { localStorage.removeItem(NOTE_PREFIX + id); if (st()) st().textContent = '✓ 保存しました'; return; }
  noteSaving = true; if (st()) st().textContent = '保存中…';
  const ok = await commit(d => { const x = d.rounds.find(y => y.id === id); if (x) { x.good = p.good; x.issue = p.issue; } }, `振り返りを更新：${r ? r.date + ' ' + r.course : id}`);
  noteSaving = false;
  if (ok) {
    const now = pendingNote(id);
    if (now && (now.good !== p.good || now.issue !== p.issue)) return noteFlush(id);  // 保存中に書き足した分
    localStorage.removeItem(NOTE_PREFIX + id);
    if (st()) st().textContent = '✓ 保存しました';
  } else if (st()) st().textContent = 'まだ保存できていません（この端末には残っています）';
}
// 前に保存しきれなかった振り返りを送る
async function flushPendingNotes() {
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith(NOTE_PREFIX)) continue;
    const id = k.slice(NOTE_PREFIX.length);
    if (id.startsWith('p:')) await prGoodFlush(id.slice(2)); else await noteFlush(id);
  }
}

function renderPracticeChart() {

  }).join('');

    <div class="trend-legend"><span>月ごとの練習時間（時間）</span><span><i class="dot"></i>回ったラウンド</span></div>`;

async function addPhotos(files) {
  for (const f of files) {
    try {
      const img = await createImageBitmap(f);
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.82, url = c.toDataURL('image/jpeg', q);
      while (url.length > 950000 && q > 0.4) { q -= 0.08; url = c.toDataURL('image/jpeg', q); }
      pdraft.newPhotos.push(url);
    } catch (e) { toast('この写真は読み込めませんでした'); }
  }
  renderPracticeEditKeep();
}
const photoCache = {};
async function photoURL(path) {
  if (photoCache[path]) return photoCache[path];

  if (!r.ok) throw new Error(r.status);
  return (photoCache[path] = URL.createObjectURL(await r.blob()));
}
async function loadPhotos() {

const THUMB_PREFIX = 'markers-thumb-';
async function loadThumbs() {

    const saved = localStorage.getItem(key);

    try {
      const img = new Image(); img.src = await photoURL(path); await img.decode();
      const k = 160 / Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const t = c.toDataURL('image/jpeg', 0.7);

    } catch (e) {}
  }
}

// 区切りのいい目盛り（3〜5本）
function niceTicks(lo, hi) {
  const span = Math.max(hi - lo, 1);
  const step = [1, 2, 5, 10, 20, 25, 50].find(st => span / st <= 4) || 100;
  let a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  if (a === b) b = a + step;
  const t = []; for (let v = a; v <= b + 1e-9; v += step) t.push(v);
  return t;
}
function miniChart(vals, { lowerBetter = true, color = '#79a694', fmt = v => v, unit = '', dates = [] } = {}) {
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return '<div class="muted" style="padding:10px 0">記録が2回分たまると線が出ます</div>';
  const AX = 38, H = 150, padL = 10, padR = 12, top = 10, bot = 26, step = 26;
  const W = Math.max(280, padL + padR + step * (vals.length - 1));
  const ys = pts.map(p => p[1]), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = i => padL + i * step;
  const y = v => top + (hi - v) / (hi - lo) * (H - top - bot);  // どのグラフも、数が少ないほど下
  const d = pts.map((p, k) => (k ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const axis = ticks.map(t => `<text x="${AX - 6}" y="${y(t) + 3.5}" font-size="10" fill="#a2a8a5" text-anchor="end">${fmt(t)}${unit}</text>`).join('');
  const grid = ticks.map(t => `<line x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#e7e7e7" stroke-width="1" ${t === lo ? '' : 'stroke-dasharray="3 4"'}/>`).join('');
  let months = '', prev = '', lastX = -99;
  dates.forEach((dt, i) => { const m = dt.slice(0, 7); if (m !== prev) { if (x(i) - lastX >= 26) { months += `<text x="${x(i)}" y="${H - 8}" font-size="10" fill="#79a694" text-anchor="middle">${+m.slice(5)}月</text>`; lastX = x(i); } prev = m; } });
  const labels = pts.map(p => `<text x="${x(p[0])}" y="${y(p[1]) - 7}" font-size="9" fill="#a2a8a5" text-anchor="middle">${fmt(p[1])}</text>`).join('');
  return `<div class="mini-wrap"><svg class="mini-axis" width="${AX}" height="${H}">${axis}</svg>
    <div class="mini-scroll"><svg width="${W}" height="${H}">
      ${grid}${months}
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.8" fill="${color}"/>`).join('')}
      <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      ${labels}
    </svg></div></div>
    <div class="row muted"><span>ベスト ${fmt(lowerBetter ? Math.min(...ys) : Math.max(...ys))}${unit}</span><span>ワースト ${fmt(lowerBetter ? Math.max(...ys) : Math.min(...ys))}${unit}</span></div>`;
}
function renderTendency() {
  { const all = sorted().filter(r => total(r) != null), best = bestRound(); renderTrend(all, best); renderTrend(all, best, PUTTS_CHART); }
  const rs = sorted().filter(r => total(r) != null);
  if (!rs.length) { $('#tendency').innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  const ST = rs.map(stats);
  const lastOf = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
  const avgOf = a => { const b = a.filter(v => v != null).slice(-5); return b.length ? (sum(b) / b.length) : null; };

    return `<div class="card"><div class="row"><h4>${title}</h4><span class="muted">直近5回の平均 ${a == null ? '–' : f(+a.toFixed(1))}${unit}</span></div>

  };

  const parRows = [3, 4, 5].filter(p => by[p].length).map(p => { const a = sum(by[p]) / by[p].length; return `<div class="bar"><span>パー${p}</span><div class="track"><div class="fill" style="width:${Math.min(100, a / 3 * 100)}%;background:${['', '', '', '#9cc3d9', '#79a694', '#f4b097'][p]}"></div></div><b>+${a.toFixed(2)}</b></div>`; }).join('');
  // コースごと
  const cs = {};
  rs.forEach(r => { const k = shortCourse(r.course); (cs[k] ||= []).push(total(r)); });
  const courseRows = Object.entries(cs).sort((a, b) => b[1].length - a[1].length || Math.min(...a[1]) - Math.min(...b[1]))
    .map(([c, v]) => `<tr><td>${esc(c)}</td><td class="muted" style="text-align:right">${v.length}回</td><td class="n">${Math.min(...v)}</td></tr>`).join('');
  $('#tendency').innerHTML =
    (ST.some(s => s.fw) ? card('FWキープ率', ST.map(s => pctv(s.fw)), { lowerBetter: false, color: '#c4c7c5' }, '%') : '') +
    (ST.some(s => s.gir != null) ? card('パーオン', ST.map(s => s.gir ?? null), { lowerBetter: false, color: '#ea9f86' }, '回') : '') +
    (ST.some(s => s.dist) ? card('トリプル以上のホール', ST.map(s => s.dist ? s.dist.tp : null), { color: '#f4b097' }, '回') : '') +
    (parRows ? `<div class="card"><h4>パーごとの平均（パーより何打多いか）</h4><div class="bars">${parRows}</div><p class="muted" style="margin:8px 0 0">パーが入っているラウンドだけで計算しています</p></div>` : '') +
    `<div class="card"><h4>コースごと</h4><table class="courses"><tr class="muted"><td>コース</td><td style="text-align:right">回数</td><td class="n" style="font-family:var(--maru);font-weight:400">ベスト</td></tr>${courseRows}</table></div>`;
  const sc = [...document.querySelectorAll('#tendency .mini-scroll')];
  sc.forEach(e => { e.scrollLeft = e.scrollWidth; });
  let syncing = false;
  sc.forEach(e => e.addEventListener('scroll', () => { if (syncing) return; syncing = true; sc.forEach(o => { if (o !== e) o.scrollLeft = e.scrollLeft; }); requestAnimationFrame(() => { syncing = false; }); }, { passive: true }));
}

function setupHTML(inSheet) {
  return `${inSheet ? '' : '<div class="page-head"><div><div class="eyebrow">BALL MARKERS</div><h2>Markers</h2></div></div>'}
  ${cfg.token && !inSheet ? `<p style="line-height:1.8;background:var(--card);border:1px solid var(--flag);border-radius:8px;padding:10px 12px">今のGitHubのキー（Stubsと共通）には、まだ <code>markers-data</code> を使う権限がありません。<br>
    <a href="https://github.com/settings/personal-access-tokens" target="_blank">キーの一覧</a> → Stubsで使っているキー →「Repository access」に <code>markers-data</code> を追加して保存 → 下の「つなぐ」。<br><b>キーの文字は変わらないので、入れ直しは不要です。</b></p>` : ''}
  <p style="line-height:1.8">記録はGitHubの非公開リポジトリ <code>markers-data</code> に保存されます。GitHubのキーはStubsと共通なので、どちらかで1回入れれば両方で使えます。</p>
  <ol>
    <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank">キーの作成ページ</a>を開く（Stubsのキーがあるなら、新しく作らずにそのキーに <code>markers-data</code> を足すだけでOK）</li>
    <li>名前は「Markers」、期限は「No expiration」（または1年）</li>
    <li>Repository access →「Only select repositories」→ <code>markers-data</code> を選ぶ</li>
    <li>Permissions →「Contents」を <b>Read and write</b> に</li>
    <li>一番下の「Generate token」→ 出てきた <code>github_pat_…</code> をコピー</li>
  </ol>
  <p class="muted" style="line-height:1.8;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px">Claudeアプリなどの中のリンクから開くと、閉じるたびにキーが消えます。<b>Safariで開くか、ホーム画面のMarkersのアイコン</b>から開いてください。「パスワードを保存」と出たら保存しておくと、次からは顔認証で入ります。</p>
  <form class="form" onsubmit="event.preventDefault();saveSettings()" action="#">
    <input type="text" name="username" autocomplete="username" value="Markers" readonly style="position:absolute;opacity:0;height:0;width:0;pointer-events:none" tabindex="-1">
    <label>GitHubのキー</label><input id="st-token" name="password" type="password" value="${esc(cfg.token || '')}" placeholder="github_pat_…" autocomplete="current-password">
    <details style="margin-top:12px"><summary class="muted">保存先を変える</summary><input id="st-repo" value="${esc(cfg.repo)}"></details>
    <div class="btns"><button class="btn primary" type="submit">つなぐ</button></div>
  </form>`;
}
/* ================= 通知（記録がない日の22時にお知らせ） ================= */
// 毎晩、markers-data の GitHub Actions が記録を確かめて、なければここに登録した端末へ送る
const VAPID_PUBLIC = 'BOH_CVVGiR62CICZ90f2dOiLBcrTQDFhsgVptASs4p0HOPOYphE3p-UiO15zHZ7VL5a-1VKwD_SjjV9D_MNw_ew';
const PUSH_FILE = 'push.json';
const standalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    return sub ? 'on' : 'off';
  } catch (e) { return 'unsupported'; }
}
function b64url(s) { const p = '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)); }
async function editPushFile(fn, msg) {
  let sha = null, list = { subs: [] };
  try { const j = await gh(PUSH_FILE); sha = j.sha; list = JSON.parse(b64dec(j.content)); } catch (e) { if (e.status !== 404) throw e; }
  fn(list);
  await gh(PUSH_FILE, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64enc(JSON.stringify(list, null, 1) + '\n'), ...(sha ? { sha } : {}) }) });
}
async function togglePush(btn) {
  const done = busy(btn, '設定しています…');
  try {
    if (await pushState() === 'on') {
      const reg = await navigator.serviceWorker.getRegistration(), sub = await reg.pushManager.getSubscription();
      await editPushFile(l => { l.subs = l.subs.filter(x => x.endpoint !== sub.endpoint); }, '通知をやめる');
      await sub.unsubscribe(); toast('通知をやめました');
    } else {
      if (await Notification.requestPermission() !== 'granted') { done(); toast('通知が許可されていません（設定アプリ→通知→Markers）'); return; }
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64url(VAPID_PUBLIC) })).toJSON();
      await editPushFile(l => { l.subs = l.subs.filter(x => x.endpoint !== sub.endpoint); l.subs.push({ ...sub, added: new Date().toISOString().slice(0, 10) }); }, '通知を受け取る端末を登録');
      toast('通知を入れました');
    }
  } catch (e) { toast('設定できませんでした（' + (e.status || e.message || 'エラー') + '）'); }
  done(); openSettings();
}
async function pushHTML() {
  const st = await pushState();
  if (st === 'unsupported' || !standalone()) return `<div class="card" style="margin:6px 0 14px"><h4>記録がない日の通知</h4><p class="muted" style="line-height:1.7;margin:6px 0 0">ホーム画面のMarkersのアイコンから開いたときに設定できます（Safariの共有ボタン →「ホーム画面に追加」）。</p></div>`;
  return `<div class="card" style="margin:6px 0 14px"><h4>記録がない日の通知</h4>
    <p class="muted" style="line-height:1.7;margin:6px 0 10px">その日に練習もラウンドも記録がなければ、22時ごろにお知らせします。</p>
    <button class="btn ${st === 'on' ? '' : 'primary'}" style="width:100%" onclick="togglePush(this)">${st === 'on' ? '通知をやめる' : '通知を受け取る'}</button></div>`;
}
async function openSettings() { openSheet((await pushHTML()) + setupHTML(true)); }
async function saveSettings() {
  busy(document.querySelector('#sheet .btn.primary, #setup .btn.primary'), 'つないでいます…');
  cfg.token = $('#st-token').value.trim();
  const r = $('#st-repo'); if (r && r.value.trim()) cfg.repo = r.value.trim();
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  if (cfg.token) localStorage.setItem(SHARED_TOKEN_KEY, cfg.token);
  closeSheet(); await start();
}
async function start() {
  try { navigator.storage?.persist?.(); } catch (e) {}
  if (!cfg.token) { $('#setup').innerHTML = setupHTML(false); $('#setup').style.display = 'block'; $('#app').style.display = 'none'; return; }
  const cache = localStorage.getItem(CACHE_KEY);
  if (cache) { db = normalize(JSON.parse(cache)); show(); }
  try { await pull(); localStorage.setItem(SHARED_TOKEN_KEY, cfg.token); show(); syncLiveFromRemote(); pushLive(); flushPendingNotes(); }
  catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) { toast('キーが違うか、権限が足りません'); $('#setup').innerHTML = setupHTML(false); $('#setup').style.display = 'block'; $('#app').style.display = 'none'; }
    else toast('オフラインです（前回の内容を表示中）');
  }
}
function show() { $('#setup').style.display = 'none'; $('#app').style.display = 'flex'; renderAll(); }
// ほかの端末やClaudeが書いた分を、画面に戻ってきたときに取り込む
document.addEventListener('visibilitychange', async () => { if (!document.hidden && cfg.token) { checkUpdate(); try { await pull(); renderAll(); } catch (e) {} } });
async function checkUpdate() {
  if (location.protocol === 'file:') return;
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const v = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
    // 入力の途中（シートが開いている）ときは邪魔しない
    if (v && v !== APP_VERSION && !$('#sheet').classList.contains('on')) location.reload();
  } catch (e) {}
}
checkUpdate();
window.addEventListener('resize', () => { if (cfg.token && db.rounds.length) renderAll(); });
start();
</script>
